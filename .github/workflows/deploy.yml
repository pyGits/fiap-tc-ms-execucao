name: Deploy

# Deploy automatizado e INDEPENDENTE deste microsserviço em ambiente
# Kubernetes, no mesmo GitFlow da Fase 3:
#   merge em `develop` -> HOMOLOGAÇÃO (namespace fiap-hml)
#   merge em `main`    -> PRODUÇÃO    (namespace fiap-prd)
#
# O cluster é criado pelo próprio pipeline com kind (Kubernetes in Docker) e
# destruído no fim da execução. A escolha está registrada no ADR-019: o
# requisito da fase é "deploy automatizado em ambiente Kubernetes", e um cluster
# efêmero no runner cumpre isso de forma reproduzível pela banca — qualquer
# pessoa pode reexecutar o workflow e ver o mesmo resultado, sem depender de uma
# conta de nuvem que estará desligada quando a entrega for corrigida.
#
# Cada microsserviço cria o SEU cluster, com a SUA mensageria e o SEU banco:
# o deploy de um não espera nem derruba o dos outros.
#
# O caminho para Amazon EKS continua escrito e versionado em
# .github/workflows/deploy-eks.yml, acionável sob demanda.
on:
  push:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      ambiente:
        description: "Ambiente de destino"
        required: true
        type: choice
        options: [hml, prd]

permissions:
  contents: read

concurrency:
  group: deploy-ms-execucao-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy automatizado em Kubernetes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Definir o ambiente de destino
        id: alvo
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            AMBIENTE="${{ inputs.ambiente }}"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            AMBIENTE="prd"
          else
            AMBIENTE="hml"
          fi
          echo "ambiente=$AMBIENTE"        >> "$GITHUB_OUTPUT"
          echo "namespace=fiap-$AMBIENTE"  >> "$GITHUB_OUTPUT"
          echo "imagem=fiap-tc-ms-execucao:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      # Nada é implantado sem a suíte completa e a cobertura no patamar: o gate
      # de qualidade vale também para o caminho do deploy, não só para o PR.
      # É este passo que atende "deploy automatizado com validação de testes".
      - name: Compilar e testar
        run: |
          npm run build
          npm run test:coverage
          npm run test:bdd

      - name: Construir a imagem
        run: docker build -t "${{ steps.alvo.outputs.imagem }}" .

      - name: Criar o cluster Kubernetes (kind)
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: fiap-fase4
          node_image: kindest/node:v1.31.0

      - name: Carregar a imagem no cluster
        run: kind load docker-image "${{ steps.alvo.outputs.imagem }}" --name fiap-fase4

      - name: Garantir o namespace
        run: |
          kubectl create namespace "${{ steps.alvo.outputs.namespace }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      # Banco e mensageria efêmeros, só para este cluster. Em cluster real são
      # banco gerenciado e o RabbitMQ compartilhado da plataforma.
      - name: Subir as dependências (MongoDB e RabbitMQ)
        run: |
          set -euo pipefail
          NS="${{ steps.alvo.outputs.namespace }}"
          kubectl -n "$NS" apply -f k8s/ci/dependencias.yaml
          kubectl -n "$NS" rollout status deployment/mongodb  --timeout=300s
          kubectl -n "$NS" rollout status deployment/rabbitmq --timeout=300s

      # O Secret deste serviço contém APENAS as credenciais do banco DELE. É o
      # mecanismo que garante, na prática, o requisito "nenhum microsserviço
      # acessa o banco de dados de outro": não há credencial para isso.
      #
      # No EKS os valores vêm do AWS Systems Manager Parameter Store; aqui
      # apontam para os serviços efêmeros do cluster. A licença do New Relic
      # fica vazia de propósito: sem ela o agente se desabilita e a conta de
      # observabilidade não recebe telemetria de execução de pipeline.
      - name: Criar o Secret do serviço
        run: |
          set -euo pipefail
          kubectl -n "${{ steps.alvo.outputs.namespace }}" \
            create secret generic ms-execucao-secret \
            --from-literal=MONGO_URI=mongodb://mongodb:27017/fiap_tc_execucao \
            --from-literal=RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672 \
            --from-literal=NEW_RELIC_LICENSE_KEY= \
            --from-literal=COGNITO_USER_POOL_ID= \
            --from-literal=COGNITO_CLIENT_ID= \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Aplicar os manifestos do overlay
        run: |
          set -euo pipefail
          kubectl kustomize "k8s/overlays/${{ steps.alvo.outputs.ambiente }}" > render.yaml
          # Aponta o overlay para a imagem recém-construída, sem editar arquivo
          # versionado (no EKS a mesma substituição recebe a URI do ECR).
          sed -i "s|image: fiap-tc-ms-execucao:.*|image: ${{ steps.alvo.outputs.imagem }}|g" render.yaml
          kubectl apply -f render.yaml

      - name: Aguardar o rollout
        run: |
          kubectl -n "${{ steps.alvo.outputs.namespace }}" \
            rollout status deployment/ms-execucao --timeout=300s

      - name: Validar o serviço no cluster (smoke test)
        run: |
          set -euo pipefail
          NS="${{ steps.alvo.outputs.namespace }}"
          kubectl -n "$NS" port-forward service/ms-execucao-service 8080:80 >/dev/null 2>&1 &
          PF=$!
          trap 'kill $PF 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health > resposta.json 2>/dev/null; then
              break
            fi
            sleep 2
          done
          cat resposta.json
          grep -q '"status":"ok"' resposta.json

      - name: Publicar o estado no resumo
        if: always()
        run: |
          NS="${{ steps.alvo.outputs.namespace }}"
          {
            echo "## Deploy do Execução Service em ${{ steps.alvo.outputs.ambiente }}"
            echo ""
            echo "Cluster: kind \`fiap-fase4\` (efêmero) · Namespace: \`$NS\`"
            echo ""
            echo "Imagem: \`${{ steps.alvo.outputs.imagem }}\`"
            echo ""
            echo '```'
            kubectl -n "$NS" get deployment,pod,svc,hpa -l app=ms-execucao 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Diagnóstico em caso de falha
        if: failure()
        run: |
          NS="${{ steps.alvo.outputs.namespace }}"
          kubectl -n "$NS" get events --sort-by=.lastTimestamp | tail -40 || true
          kubectl -n "$NS" describe deployment/ms-execucao || true
          kubectl -n "$NS" logs -l app=ms-execucao --all-containers --tail=100 || true
