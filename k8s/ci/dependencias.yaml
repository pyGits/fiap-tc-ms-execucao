# Dependências EFÊMERAS do pipeline — existem só dentro do cluster kind que o
# GitHub Actions cria e destrói em cada execução do workflow "Deploy".
#
# NÃO é o ambiente real: em um cluster de verdade o MongoDB seria um banco
# gerenciado e o RabbitMQ viria da plataforma, com volume persistente. Aqui
# tudo é emptyDir, porque o cluster morre no fim do job.
#
# A razão de existirem: este serviço falha rápido e de propósito quando não
# alcança a mensageria, e o repositório Mongo é verificado na subida. Sem estes
# dois, o pod nunca ficaria Ready e o `rollout status` do pipeline acusaria uma
# falha que não é da aplicação.
#
# MongoDB standalone (sem replica set) é suficiente: a Execução não usa
# transações multi-documento, apenas operações atômicas de documento único.
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  labels:
    app: mongodb
    fiap.io/efemero: "true"
spec:
  selector:
    app: mongodb
  ports:
    - name: mongodb
      port: 27017
      targetPort: 27017
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  labels:
    app: mongodb
    fiap.io/efemero: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:7.0
          ports:
            - containerPort: 27017
          readinessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - "db.adminCommand('ping').ok"
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              memory: "1Gi"
          volumeMounts:
            - name: dados
              mountPath: /data/db
      volumes:
        - name: dados
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  labels:
    app: rabbitmq
    fiap.io/efemero: "true"
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  labels:
    app: rabbitmq
    fiap.io/efemero: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management-alpine
          ports:
            - containerPort: 5672
            - containerPort: 15672
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "check_port_connectivity"]
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 30
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              memory: "768Mi"
          volumeMounts:
            - name: dados
              mountPath: /var/lib/rabbitmq
      volumes:
        - name: dados
          emptyDir: {}
