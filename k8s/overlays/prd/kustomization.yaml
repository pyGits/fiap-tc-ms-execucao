apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Ambiente de PRODUÇÃO — deploy automático a cada merge em `main`.
namespace: fiap-prd

resources:
  - namespace.yaml
  - ../../base

images:
  - name: fiap-tc-ms-execucao
    newName: fiap-tc-ms-execucao
    newTag: prd

patches:
  - path: patch-deployment.yaml

configMapGenerator:
  - name: ms-execucao-config
    behavior: merge
    literals:
      - APP_ENV=prd
      - NEW_RELIC_APP_NAME=fiap-tc-ms-execucao-prd
      - NEW_RELIC_LABELS=env:prd;project:fiap-tech-challenge;servico:ms-execucao
      - LOG_LEVEL=info

generatorOptions:
  disableNameSuffixHash: true
