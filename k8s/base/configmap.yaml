apiVersion: v1
kind: ConfigMap
metadata:
  name: ms-execucao-config
data:
  # Valores não sensíveis. Os sensíveis (MONGO_URI, RABBITMQ_URL, licença do
  # New Relic, IDs do Cognito) vêm do Secret "ms-execucao-secret", criado pelo
  # pipeline a partir do AWS Systems Manager Parameter Store.
  PORT: "3002"
  NODE_ENV: "production"
  SERVICE_NAME: "fiap-tc-ms-execucao"
  MONGO_DB: "fiap_tc_execucao"
  MONGO_TIMEOUT_MS: "5000"
  LOG_LEVEL: "info"
  AUTH_DISABLED: "false"
  RABBITMQ_PREFETCH: "10"
  LIMITE_LISTAGEM: "200"
  # Capacidade da oficina: fila cheia é recusa legítima de negócio e é o que dá
  # à Saga um caminho de falha realista no último passo.
  CAPACIDADE_FILA: "20"
  NEW_RELIC_DISTRIBUTED_TRACING_ENABLED: "true"
  NEW_RELIC_APPLICATION_LOGGING_FORWARDING_ENABLED: "true"
  NEW_RELIC_APPLICATION_LOGGING_LOCAL_DECORATING_ENABLED: "false"
  NEW_RELIC_LOG: "stdout"
