apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-execucao
  labels:
    app: ms-execucao
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ms-execucao
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: ms-execucao
    spec:
      containers:
        - name: ms-execucao
          image: fiap-tc-ms-execucao
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3002
          env:
            # Carrega o agente APM antes da aplicação, habilitando o tracing
            # distribuído entre os três microsserviços.
            - name: NODE_OPTIONS
              value: "-r newrelic"
          envFrom:
            - configMapRef:
                name: ms-execucao-config
            - secretRef:
                name: ms-execucao-secret
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "192Mi"
            limits:
              cpu: "500m"
              memory: "384Mi"
