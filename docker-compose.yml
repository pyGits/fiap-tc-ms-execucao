# Ambiente local do Execução Service.
#
# Depende da rede `oficina-net` e do RabbitMQ criados pelo compose do
# fiap-tc-ms-os — suba aquele primeiro:
#
#   (em fiap-tc-ms-os)       docker compose up -d --build
#   (aqui)                   docker compose up -d --build
#
# API do Execução: http://localhost:3002/api-docs
services:
  # Banco PRÓPRIO do Execução. Nenhum outro serviço tem credencial aqui.
  mongo-execucao:
    image: mongo:7
    container_name: oficina-mongo-execucao
    ports:
      - "27018:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - mongo-execucao-dados:/data/db
    networks: [oficina-net]

  ms-execucao:
    build: .
    container_name: oficina-ms-execucao
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      NODE_ENV: production
      SERVICE_NAME: fiap-tc-ms-execucao
      MONGO_URI: mongodb://mongo-execucao:27017
      MONGO_DB: fiap_tc_execucao
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      AUTH_DISABLED: "true"
      LOG_LEVEL: debug
      # Capacidade reduzida no ambiente local: encher a fila e ver a Saga
      # compensar fica a quatro requisições de distância.
      CAPACIDADE_FILA: "3"
    depends_on:
      mongo-execucao:
        condition: service_healthy
    networks: [oficina-net]

volumes:
  mongo-execucao-dados:

networks:
  oficina-net:
    name: oficina-net
    external: true
